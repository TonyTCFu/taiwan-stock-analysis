name: Daily Stock Data Update & Deploy

on:
  schedule:
    # Runs Monday to Friday at 06:30 UTC (14:30 Taiwan Time, right after TWSE market closes)
    - cron: '30 6 * * 1-5'
  workflow_dispatch:

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance requests

      - name: Fetch Live Market Data
        run: |
          python fetch_data.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/stock_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update: Taiwan stock data [skip ci]" && git push)

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
