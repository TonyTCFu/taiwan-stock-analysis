name: Cloud Daily Stock Analysis Update

on:
  schedule:
    # Weekdays 06:30 UTC = 14:30 Asia/Taipei (after TWSE close 13:30)
    - cron: '30 6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stock-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl requests

      - name: Fetch live quotes via Render gateway
        run: python cloud_daily_update.py

      - name: Rebuild Excel from stock_data.json
        run: python create_shioaji_excel.py

      - name: Commit and Push Updated Data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/stock_data.json \
            "台股 5 大 AI 核心卡位龙头深度投资与买卖点筹码量化分析表.xlsx"
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "auto: Cloud Shioaji daily update [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]"
            git push
          fi
